name: Automated Tests (Playwright & Karate)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  lint-and-format:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Check Prettier formatting
        run: npm run format:check

  karate-api:
    name: Karate API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Run Karate API tests
        id: run_karate
        run: npm run test:api
        continue-on-error: true
      - name: Output Karate API test results
        if: always()
        run: node tests/support/generate-summary.js api
      - name: Upload Karate reports artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: karate-reports
          path: reports/karate/
          if-no-files-found: warn
      - name: Check Karate test status
        if: always()
        run: |
          if [ "${{ steps.run_karate.outcome }}" != "success" ]; then
            echo "Karate API tests failed."
            exit 1
          fi

  playwright-web:
    name: Playwright Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright Web tests
        id: run_playwright
        run: npm run test:web
        continue-on-error: true
        env:
          BASE_URL: https://demoqa.com
          REGISTRATION_MODE: api
      - name: Output Playwright Web test results
        if: always()
        run: node tests/support/generate-summary.js web
      - name: Upload Cucumber reports artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cucumber-reports
          path: reports/
          if-no-files-found: warn
      - name: Check Playwright test status
        if: always()
        run: |
          if [ "${{ steps.run_playwright.outcome }}" != "success" ]; then
            echo "Playwright Web tests failed."
            exit 1
          fi
